services:

  # ---------------------------------------------------------------
  # PostgreSQL — shared by Odoo
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: kleanet_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odoo']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Odoo — image odoo:17.0 utilisée car il n'existe pas encore
  # d'image officielle odoo:19 sur Docker Hub (à mettre à jour
  # dès que disponible). Si tu as déjà Odoo 19 installé en natif
  # sur ta machine, tu peux commenter tout ce bloc et pointer
  # ODOO_URL dans .env vers ton instance locale (ex: localhost:8068).
  # ---------------------------------------------------------------
  odoo:
    image: odoo:17.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo
    ports:
      - '8069:8069'
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Redis — JWT refresh tokens + catalogue cache
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Kleanet API — Fastify/TypeScript
  # ---------------------------------------------------------------
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  odoo-data:
  redis-data:
  api-node-modules:
